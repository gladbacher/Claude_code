version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://golftracer:golftracer@postgres:5432/golftracer
      - STORAGE_BACKEND=local
      - UPLOAD_DIR=/app/uploads
      - EXPORT_DIR=/app/exports
      - USE_GPU=auto
      - CORS_ORIGINS=http://localhost:8081,exp://localhost:8081
    volumes:
      - uploads:/app/uploads
      - exports:/app/exports
      - ./backend/models/weights:/app/backend/models/weights
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: golftracer
      POSTGRES_USER: golftracer
      POSTGRES_PASSWORD: golftracer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golftracer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Redis for future Celery queue
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

volumes:
  pgdata:
  uploads:
  exports:
